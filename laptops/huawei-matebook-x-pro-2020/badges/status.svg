<svg xmlns="http://www.w3.org/2000/svg"
    width="138"
    height="20"
    role="img"
    aria-label="Page status: draft">

    <title>Page status: draft</title>

    <defs>

        <!-- Neutral graphite label -->
        <linearGradient id="labelGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0%"
                  stop-color="#59616a"/>

            <stop offset="100%"
                  stop-color="#454b52"/>

        </linearGradient>

        <!-- Status color -->
        <linearGradient id="messageGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0%"
                  stop-color="#FFC107"/>

            <stop offset="100%"
                  stop-color="#FFB300"/>

        </linearGradient>

        <!-- Subtle top highlight -->
        <linearGradient id="highlightGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0%"
                  stop-color="#ffffff"
                  stop-opacity="0.16"/>

            <stop offset="55%"
                  stop-color="#ffffff"
                  stop-opacity="0.04"/>

            <stop offset="100%"
                  stop-color="#ffffff"
                  stop-opacity="0"/>

        </linearGradient>

    </defs>

    <!-- Label -->
    <rect x="0"
          y="0"
          width="88"
          height="20"
          rx="4"
          fill="url(#labelGradient)"/>

    <!-- Status -->
    <rect x="88"
          y="0"
          width="50"
          height="20"
          rx="4"
          fill="url(#messageGradient)"/>

    <!-- Hide the inner rounded corner between segments -->
    <rect x="84"
          y="0"
          width="8"
          height="20"
          fill="url(#labelGradient)"/>

    <rect x="88"
          y="0"
          width="4"
          height="20"
          fill="url(#messageGradient)"/>

    <!-- Subtle highlight -->
    <rect x="0"
          y="0"
          width="138"
          height="10"
          rx="4"
          fill="url(#highlightGradient)"/>

    <!-- Soft outer border -->
    <rect x="0.5"
          y="0.5"
          width="137"
          height="19"
          rx="3.5"
          fill="none"
          stroke="#000000"
          stroke-opacity="0.20"/>

    <!-- Text -->
    <g fill="#ffffff"
       text-anchor="middle"
       font-family="Verdana,DejaVu Sans,sans-serif"
       font-size="11"
       font-weight="400">

        <text x="44.0"
              y="14.5">
            Page status
        </text>

        <text x="113.0"
              y="14.5">
            draft
        </text>

    </g>

</svg>
