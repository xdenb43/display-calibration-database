<svg xmlns="http://www.w3.org/2000/svg"
    width="174"
    height="20"
    role="img"
    aria-label="ICC profile: unavailable">

    <title>ICC profile: unavailable</title>

    <defs>

        <!--
            Very subtle Shields-inspired gradient
            for the label section.
        -->
        <linearGradient id="labelGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">

            <stop offset="0%"
                  stop-color="#5A5A5A"/>

            <stop offset="100%"
                  stop-color="#505050"/>

        </linearGradient>


        <!--
            Very subtle status gradient.
            Keeps the Shields.io base color
            while avoiding a completely flat look.
        -->
        <linearGradient id="messageGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">

            <stop offset="0%"
                  stop-color="#DD4343"/>

            <stop offset="100%"
                  stop-color="#D03F3F"/>

        </linearGradient>


        <!--
            Very soft top highlight.
            Much weaker than the original version.
        -->
        <linearGradient id="highlightGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">

            <stop offset="0%"
                  stop-color="#FFFFFF"
                  stop-opacity="0.08"/>

            <stop offset="60%"
                  stop-color="#FFFFFF"
                  stop-opacity="0.02"/>

            <stop offset="100%"
                  stop-color="#FFFFFF"
                  stop-opacity="0"/>

        </linearGradient>

    </defs>


    <!-- =====================================================
         Base badge
         ===================================================== -->

    <rect x="0"
          y="0"
          width="174"
          height="20"
          rx="3.5"
          fill="#555555"/>


    <!-- =====================================================
         Label section
         ===================================================== -->

    <path
        d="
            M 3.5 0
            H 90
            V 20
            H 3.5
            A 3.5 3.5 0 0 1 0 16.5
            V 3.5
            A 3.5 3.5 0 0 1 3.5 0
            Z
        "
        fill="url(#labelGradient)"
    />


    <!-- =====================================================
         Message section
         ===================================================== -->

    <path
        d="
            M 90 0
            H 170.5
            A 3.5 3.5 0 0 1 174 3.5
            V 16.5
            A 3.5 3.5 0 0 1 170.5 20
            H 90
            Z
        "
        fill="url(#messageGradient)"
    />


    <!-- =====================================================
         Soft highlight
         ===================================================== -->

    <rect x="0"
          y="0"
          width="174"
          height="10"
          rx="3.5"
          fill="url(#highlightGradient)"/>


    <!-- =====================================================
         Text
         ===================================================== -->

    <g fill="#FFFFFF"
       text-anchor="middle"
       font-family="Verdana,DejaVu Sans,sans-serif"
       font-size="11"
       font-weight="400">

        <text x="45.0"
              y="14.5">

            ICC profile

        </text>


        <text x="132.0"
              y="14.5">

            unavailable

        </text>

    </g>


</svg>
