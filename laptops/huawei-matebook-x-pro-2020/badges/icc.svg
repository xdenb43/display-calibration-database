<svg xmlns="http://www.w3.org/2000/svg"
    width="174"
    height="20"
    role="img"
    aria-label="ICC profile: unavailable">

    <title>ICC profile: unavailable</title>

    <defs>

        <!-- Neutral graphite label -->
        <linearGradient id="labelGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0%"
                  stop-color="#59616a"/>

            <stop offset="100%"
                  stop-color="#454b52"/>

        </linearGradient>

        <!-- Shields.io based status color -->
        <linearGradient id="messageGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0%"
                  stop-color="#DD4343"/>

            <stop offset="100%"
                  stop-color="#C73C3C"/>

        </linearGradient>

        <!-- Subtle top highlight -->
        <linearGradient id="highlightGradient"
                        x1="0" y1="0"
                        x2="0" y2="1">

            <stop offset="0%"
                  stop-color="#ffffff"
                  stop-opacity="0.16"/>

            <stop offset="55%"
                  stop-color="#ffffff"
                  stop-opacity="0.04"/>

            <stop offset="100%"
                  stop-color="#ffffff"
                  stop-opacity="0"/>

        </linearGradient>

    </defs>

    <!-- Label -->
    <rect x="0"
          y="0"
          width="90"
          height="20"
          rx="4"
          fill="url(#labelGradient)"/>

    <!-- Status -->
    <rect x="90"
          y="0"
          width="84"
          height="20"
          rx="4"
          fill="url(#messageGradient)"/>

    <!-- Hide the inner rounded corner between segments -->
    <rect x="86"
          y="0"
          width="8"
          height="20"
          fill="url(#labelGradient)"/>

    <rect x="90"
          y="0"
          width="4"
          height="20"
          fill="url(#messageGradient)"/>

    <!-- Subtle highlight -->
    <rect x="0"
          y="0"
          width="174"
          height="10"
          rx="4"
          fill="url(#highlightGradient)"/>

    <!-- Soft outer border -->
    <rect x="0.5"
          y="0.5"
          width="173"
          height="19"
          rx="3.5"
          fill="none"
          stroke="#000000"
          stroke-opacity="0.20"/>

    <!-- Text -->
    <g fill="#ffffff"
       text-anchor="middle"
       font-family="Verdana,DejaVu Sans,sans-serif"
       font-size="11"
       font-weight="400">

        <text x="45.0"
              y="14.5">
            ICC profile
        </text>

        <text x="132.0"
              y="14.5">
            unavailable
        </text>

    </g>

</svg>
